name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  # 语法自检：ubuntu 上预装 Swift，-parse 不需要 iOS SDK，能在几分钟内报出语法错
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swiftc -parse
        run: |
          swift --version
          swiftc -parse -parse-as-library Sources/App.swift && echo "语法 OK"

  # 多个 macOS 标签一起排：不支持的会被秒拒（configuration not supported），能调起机器的才跑。
  # fail-fast: false → 任何一个出包就够。
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]   # 实测只有这个标签能分到机器（13 纯排队、14 配置不受支持、-large/-xlarge 无权限）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -a
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: 取游戏资源（yymc-desktop 的 site/）
        run: |
          git clone --depth 1 https://github.com/mdy114514mdy/yymc-desktop.git _site_src
          cp -R _site_src/site ./site
          du -sh ./site
          ls ./site

      - name: 编译并打包
        run: bash build.sh

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: yymc-ios-ipa-${{ matrix.os }}
          path: YYMC.ipa
          if-no-files-found: error
